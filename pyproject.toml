[project]
name = "ferrogrid"
version = "0.1.0"
description = "Multi-server GPU training platform: Rust control plane over PyTorch FSDP2 + NCCL, with Mojo/MAX custom kernels"
readme = "README.md"
license = "Apache-2.0"
# MAX ships wheels for CPython 3.10-3.14.
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
# Torch is only needed where you actually run training. On the GPU servers it
# comes from the Docker image, so it is an extra rather than a hard dependency
# -- the controller host does not need a 2.5 GB download to run `ferro`.
torch = ["torch>=2.6"]
# Mojo + MAX. `modular` is the meta-package that pulls in `max` and `mojo`.
mojo = ["modular>=26.5"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ferro-setup = "ferro_setup:main"
ferro-mojo-info = "ferro_mojo:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# python/ferro_mojo.py -> ferro_mojo, python/ferro_setup.py -> ferro_setup
sources = ["python"]
only-include = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
