syntax = "proto3";
package ferrogrid.v1;

// ---------------------------------------------------------------------------
// Common resource types
// ---------------------------------------------------------------------------

// A single physical GPU as reported by NVML.
message Gpu {
  uint32 index          = 1;   // NVML device index on its node
  string uuid           = 2;   // stable GPU UUID, used for scheduling
  string name           = 3;   // e.g. "NVIDIA GeForce RTX 4090"
  uint64 memory_total_b = 4;
  uint64 memory_used_b  = 5;
  uint32 utilization_pct = 6;  // SM utilization 0-100
  uint32 memory_util_pct = 7;
  uint32 temperature_c   = 8;
  uint32 power_usage_mw  = 9;
  uint32 power_limit_mw  = 10;
  string cuda_capability = 11; // e.g. "8.9"
  // Job currently holding this GPU according to the agent, empty if free.
  string allocated_job_id = 12;
  // Measured bf16 matmul throughput in TFLOP/s from `ferro bench`, so the
  // scheduler can rank real hardware instead of guessing from the model name.
  // Zero means "never benchmarked".
  double bench_tflops     = 13;
  int64 bench_unix_s      = 14;
}

// A process holding a GPU right now, as reported by NVML on the node.
// FerroGrid did not necessarily launch it: an interactive python, another
// scheduler's container or a desktop session all show up here, which is the
// difference between "this GPU is free" and "this GPU is idle but occupied".
message GpuProcess {
  uint32 gpu_index     = 1;
  uint32 pid           = 2;   // host pid, even for processes inside containers
  uint64 memory_used_b = 3;   // 0 when the driver does not report per-process memory
  string user          = 4;   // OS user owning the process
  string command       = 5;   // argv, trimmed; falls back to comm
  int64 started_unix_s = 6;
  string container     = 7;   // docker container name, empty when on the host
  // Set when the agent could attribute this process to a job it launched.
  string job_id        = 8;
  string kind          = 9;   // "compute" | "graphics"
  // SM utilisation NVML attributes to this pid. Older drivers cannot do it at
  // all, hence the companion flag: 0% and "we don't know" are different
  // answers, and only one of them justifies calling a process a squatter.
  uint32 utilization_pct = 10;
  bool utilization_known = 11;
  // Last time the agent saw this process doing work. `now - busy_unix_s` is
  // how long it has been sitting on its VRAM doing nothing. 0 = unknown.
  int64 busy_unix_s      = 12;
}

// Foreign processes on one GPU, folded per user: the JOB column needs "who
// else is on this card", not a process list.
message GpuOccupant {
  string user          = 1;
  uint32 processes     = 2;
  uint64 memory_used_b = 3;
  // Last time any of this user's processes on the card did work; 0 = the
  // driver cannot attribute utilisation, so idleness is unknown.
  int64 busy_unix_s    = 4;
}

message NodeInfo {
  string node_id        = 1;   // stable id, defaults to hostname
  string hostname       = 2;
  string address        = 3;   // IP:port the agent's gRPC server listens on
  string nccl_address   = 4;   // IP used for NCCL/MASTER_ADDR (may differ from mgmt IP)
  string driver_version = 5;
  string cuda_version   = 6;
  string agent_version  = 7;
  uint32 cpu_count      = 8;
  uint64 memory_total_b = 9;
  repeated Gpu gpus     = 10;
  // Set when NVML could not be initialised; gpus will be empty.
  string gpu_error      = 11;
  // Workspace root on this node; relative script paths resolve against it.
  string workspace      = 12;
  // OS user the agent runs as, used as the rsync/ssh login.
  string user           = 13;
  // Everything holding a GPU on this node, ours or not.
  repeated GpuProcess processes = 14;
  // The interface carrying nccl_address and what it negotiated. A node that
  // came up at 100 Mb/s looks exactly like a healthy one everywhere else, and
  // drags every job that spans it down by 10x.
  string link_iface = 15;
  uint32 link_mbps  = 16;   // 0 = unknown
}

// ---------------------------------------------------------------------------
// Controller service: agents register here, CLI queries here.
// ---------------------------------------------------------------------------

message RegisterRequest { NodeInfo node = 1; }
message RegisterResponse {
  bool accepted             = 1;
  string message            = 2;
  uint32 heartbeat_interval_s = 3;
}

message HeartbeatRequest {
  string node_id        = 1;
  repeated Gpu gpus     = 2;
  repeated JobStatus jobs = 3;
  repeated GpuProcess processes = 4;
}
message HeartbeatResponse { bool known = 1; }

message ListNodesRequest {}
message ListNodesResponse { repeated NodeState nodes = 1; }

message NodeState {
  NodeInfo info          = 1;
  bool healthy           = 2;
  int64 last_seen_unix_s = 3;
  uint32 free_gpus       = 4;
}

message ListGpusRequest {}
message GpuEntry {
  string node_id = 1;
  Gpu gpu        = 2;
  bool healthy   = 3;
  // Who else is on this card. Empty does not mean idle -- it can also mean the
  // node's agent is too old to report processes.
  repeated GpuOccupant occupants = 4;
  // Whether the scheduler would place work here: no job of ours, and enough
  // free VRAM. Somebody's compositor holding 80 MB does not make a 24 GB card
  // unusable, so "occupied" and "unusable" are separate answers.
  bool schedulable = 5;
}
message ListGpusResponse { repeated GpuEntry gpus = 1; }

// ---------------------------------------------------------------------------
// Training job submission
// ---------------------------------------------------------------------------

message SubmitJobRequest {
  string script             = 1;  // path to the python entrypoint (in-container)
  repeated string script_args = 2;
  uint32 nodes              = 3;
  uint32 gpus_per_node      = 4;
  string image              = 5;  // docker image; empty => controller default
  string workdir            = 6;  // host dir bind-mounted into the container
  map<string, string> env   = 7;
  string name               = 8;
  // Restrict placement to these node ids. Empty => scheduler picks freely.
  repeated string node_filter = 9;
  // Let the scheduler choose the shape: nodes and gpus_per_node are ignored.
  bool auto_place           = 11;
  // Login name of whoever submitted this, so a shared cluster can tell whose
  // job is occupying a GPU. Set by the CLI.
  string submitted_by       = 12;
  // Cancel the job if it is still running after this many seconds. 0 = never.
  uint32 timeout_s          = 13;
  // Extra bind mounts, "HOST[:CONTAINER][:ro]". Datasets normally live on
  // shared storage outside the workspace, so they need mounting explicitly.
  repeated string mounts = 10;
  // Queue instead of failing when nothing is free: the controller retries the
  // placement until it fits. A shared cluster is full most of the time, and
  // resubmitting by hand at 03:00 is not a scheduling policy.
  bool queue             = 14;
  // Give up queueing after this many seconds. 0 = wait indefinitely.
  uint32 queue_timeout_s = 15;
}

message SubmitJobResponse {
  string job_id  = 1;
  bool accepted  = 2;
  string message = 3;
  JobPlan plan   = 4;
  // Non-zero when the job was queued instead of placed: where it sits in line.
  uint32 queue_position = 5;
}

// The concrete placement decision the scheduler made.
message JobPlan {
  string master_addr = 1;
  uint32 master_port = 2;
  uint32 world_size  = 3;
  repeated JobPlacement placements = 4;
}

message JobPlacement {
  string node_id             = 1;
  string address             = 2;
  uint32 node_rank           = 3;
  repeated uint32 gpu_indices = 4;
  repeated string gpu_uuids   = 5;
}

enum JobPhase {
  JOB_PHASE_UNSPECIFIED = 0;
  JOB_PHASE_PENDING     = 1;
  JOB_PHASE_LAUNCHING   = 2;
  JOB_PHASE_RUNNING     = 3;
  JOB_PHASE_SUCCEEDED   = 4;
  JOB_PHASE_FAILED      = 5;
  JOB_PHASE_CANCELLED   = 6;
}

message JobStatus {
  string job_id       = 1;
  string node_id      = 2;
  uint32 node_rank    = 3;
  JobPhase phase      = 4;
  int32 exit_code     = 5;
  string message      = 6;
  int64 started_unix_s = 7;
  int64 ended_unix_s   = 8;
}

message JobSummary {
  string job_id        = 1;
  string name          = 2;
  string submitted_by  = 9;
  JobPhase phase       = 3;
  JobPlan plan         = 4;
  repeated JobStatus per_node = 5;
  int64 submitted_unix_s = 6;
  // Aggregated NCCL / distributed error lines detected in the logs.
  repeated string nccl_errors = 7;
  TrainingMetrics metrics = 8;
  // Waiting for capacity rather than running. `plan` is empty until it is
  // placed; position is 1-based within the queue.
  bool queued            = 10;
  uint32 queue_position  = 11;
}

message TrainingMetrics {
  uint64 step               = 1;
  double loss               = 2;
  double samples_per_s      = 3;
  double tokens_per_s       = 4;
  double step_time_ms       = 5;
  double peak_vram_gb       = 6;
  int64 updated_unix_s      = 7;
  // Rolling average GPU utilisation across all GPUs in the job.
  double avg_gpu_util_pct   = 8;
}

message GpuBenchmark {
  string node_id  = 1;
  uint32 index    = 2;
  string uuid     = 3;
  string name     = 4;
  double tflops   = 5;
  string error    = 6;
}

message GetJobRequest { string job_id = 1; }
message ListJobsRequest { uint32 limit = 1; }

// `ferro ps`: what is running right now, and on which GPUs -- including
// processes FerroGrid did not launch.
message ListProcessesRequest {}
message ProcessEntry {
  string job_id        = 1;
  string name          = 2;
  string node_id       = 3;
  uint32 node_rank     = 4;
  repeated uint32 gpu_indices = 5;
  JobPhase phase       = 6;
  int64 started_unix_s = 7;
  uint32 world_size    = 8;
  string image         = 9;
  TrainingMetrics metrics = 10;
  // Who submitted the job.
  string user          = 13;
  // OS account the container runs as on this node (the agent's account).
  string runs_as       = 14;
  // Live utilisation of just this rank's GPUs, averaged.
  double gpu_util_pct  = 11;
  double vram_used_gb  = 12;
  // Set for a process FerroGrid did not launch, or whose job this controller
  // no longer knows about. Then job_id/name/phase carry nothing useful and
  // pid/command/container describe the process instead.
  bool external        = 15;
  uint32 pid           = 16;
  string command       = 17;
  string container     = 18;
  // Utilisation of this process alone, where the driver can attribute it, and
  // when it was last seen doing work. `gpu_util_pct` above stays the device's.
  double proc_util_pct = 21;
  bool proc_util_known = 22;
  int64 busy_unix_s    = 23;
  // When the node this row came from last reported. Every number here is only
  // as fresh as that, and a wedged agent otherwise reads as an idle GPU.
  int64 node_last_seen_unix_s = 19;
  // "compute" | "graphics", from NVML. A desktop compositor is not a squatter.
  string kind          = 20;
}
message ListProcessesResponse { repeated ProcessEntry processes = 1; }

// `ferro ps <pid>`: everything about one process, read fresh off the node
// rather than taken from the last heartbeat.
message DescribeProcessRequest { uint32 pid = 1; }

// One GPU a process is holding.
message GpuHold {
  uint32 index            = 1;
  string name             = 2;
  uint64 memory_used_b    = 3;   // this process's share
  uint32 device_util_pct  = 4;   // the whole card, not this pid
}

message ProcessDetail {
  string node_id         = 1;
  uint32 pid             = 2;
  // False when the node has no such process; the other fields are then unset.
  bool found             = 3;
  string user            = 4;
  uint32 uid             = 5;
  // The full command line, untruncated -- the table only has room for a
  // prefix, and the argument that says which run this is tends to be at the
  // end.
  string command         = 6;
  string cwd             = 7;
  string state           = 8;    // running, sleeping, zombie, ...
  uint32 threads         = 9;
  uint64 rss_b           = 10;
  int64 started_unix_s   = 11;
  uint32 ppid            = 12;
  string parent_command  = 13;
  string container       = 14;
  string container_id    = 15;
  string job_id          = 16;
  string kind            = 17;   // "compute" | "graphics"
  uint32 utilization_pct = 18;
  bool utilization_known = 19;
  int64 busy_unix_s      = 20;
  repeated GpuHold gpus  = 21;
  // Login the agent runs as, for the "stop it with" hint.
  string node_user       = 22;
  // Whether `busy_unix_s` is a sighting or just when the agent started
  // watching. "Idle since we started looking" is a weaker claim than "idle
  // since it last did work", and the difference matters when the conclusion
  // is that somebody should give a card back.
  bool busy_seen         = 23;
}

message DescribeProcessResponse {
  // One entry per node that has the pid. More than one is possible: pids are
  // only unique per machine.
  repeated ProcessDetail matches = 1;
}

// Plugins: external transfer tools (Nextcloud, S3, rsync, ...) that FerroGrid
// invokes on the nodes rather than reimplementing.
message PluginInfo {
  string name        = 1;
  string description = 2;
  bool can_fetch     = 3;
  bool can_push      = 4;
}
message ListPluginsRequest {}
message ListPluginsResponse { repeated PluginInfo plugins = 1; }

message RunPluginRequest {
  string plugin  = 1;
  // "fetch" (remote -> node) or "push" (node -> remote).
  string action  = 2;
  string remote  = 3;
  string local   = 4;
  // Empty => every healthy node. Fetching on all of them in parallel is the
  // point: each node pulls its own copy instead of relaying through one host.
  repeated string node_filter = 5;
  uint32 timeout_s = 6;
}
message PluginResult {
  string node_id  = 1;
  int32 exit_code = 2;
  string output   = 3;
  string error    = 4;
  double seconds  = 5;
}
message RunPluginResponse { repeated PluginResult results = 1; }

// `ferro net`: measured TCP throughput between nodes, which is what a
// cross-node job actually runs at -- `p2p_probe.py` proves NCCL connects, this
// says how fast.
message MeasureNetworkRequest {
  repeated string node_filter = 1;
  // Seconds per pair. 0 => controller default.
  uint32 seconds = 2;
  // Measure both directions. Ethernet is usually symmetric, so this is off by
  // default -- but when it is not, that asymmetry is the diagnosis.
  bool both_ways = 3;
}
message NetPair {
  string from_node = 1;
  string to_node   = 2;
  double mbps      = 3;
  // The slower of the two ends' link speeds, for context. 0 = unknown.
  uint32 link_mbps = 4;
  string error     = 5;
}
message MeasureNetworkResponse { repeated NetPair pairs = 1; }

// Agent side of the measurement: one node drains, the other sends.
message NetSinkRequest { uint32 seconds = 1; }
message NetSinkResponse { uint32 port = 1; }
message NetProbeRequest {
  string host    = 1;
  uint32 port    = 2;
  uint32 seconds = 3;
}
message NetProbeResponse {
  uint64 bytes_sent = 1;
  double seconds    = 2;
  double mbps       = 3;
}

// `ferro bench`: ask agents to measure their GPUs.
message BenchmarkNodesRequest {
  repeated string node_filter = 1;
  // Re-measure even when a cached result exists.
  bool force = 2;
}
message BenchmarkNodesResponse { repeated GpuBenchmark results = 1; }
message ListJobsResponse { repeated JobSummary jobs = 1; }
message CancelJobRequest { string job_id = 1; }
message CancelJobResponse { bool cancelled = 1; string message = 2; }

message LogRequest { string job_id = 1; bool follow = 2; }

message LogLine {
  string job_id   = 1;
  string node_id  = 2;
  uint32 node_rank = 3;
  string stream   = 4; // "stdout" | "stderr" | "system"
  string line     = 5;
  int64 unix_ms   = 6;
}

// Agents push logs and metrics up to the controller.
message ReportLogsRequest { repeated LogLine lines = 1; }
message ReportLogsResponse {}

message ReportJobStatusRequest { JobStatus status = 1; }
message ReportJobStatusResponse {}

service Controller {
  rpc RegisterNode(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc ListGpus(ListGpusRequest) returns (ListGpusResponse);

  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (JobSummary);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc DescribeProcess(DescribeProcessRequest) returns (DescribeProcessResponse);
  rpc BenchmarkNodes(BenchmarkNodesRequest) returns (BenchmarkNodesResponse);
  rpc MeasureNetwork(MeasureNetworkRequest) returns (MeasureNetworkResponse);
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc RunPlugin(RunPluginRequest) returns (RunPluginResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc StreamLogs(LogRequest) returns (stream LogLine);

  // Agent -> controller streaming of job output and status.
  rpc ReportLogs(ReportLogsRequest) returns (ReportLogsResponse);
  rpc ReportJobStatus(ReportJobStatusRequest) returns (ReportJobStatusResponse);
}

// ---------------------------------------------------------------------------
// Agent service: controller calls into each node.
// ---------------------------------------------------------------------------

message LaunchJobRequest {
  string job_id             = 1;
  uint32 node_rank          = 2;
  uint32 nnodes             = 3;
  uint32 nproc_per_node     = 4;
  string master_addr        = 5;
  uint32 master_port        = 6;
  repeated uint32 gpu_indices = 7;
  string image              = 8;
  string workdir            = 9;
  string script             = 10;
  repeated string script_args = 11;
  map<string, string> env   = 12;
  // Extra torchrun args passed verbatim.
  repeated string torchrun_args = 13;
  // Extra bind mounts, "HOST[:CONTAINER][:ro]".
  repeated string mounts = 14;
}

message LaunchJobResponse { bool launched = 1; string message = 2; }

message StopJobRequest { string job_id = 1; }
message StopJobResponse { bool stopped = 1; string message = 2; }

message BenchmarkRequest {
  bool force = 1;
}

// The controller resolves a plugin's argv from its own config and sends it
// here already expanded, so the agent never parses a command string.
message ExecPluginRequest {
  string plugin    = 1;
  repeated string argv = 2;
  string workdir   = 3;
  uint32 timeout_s = 4;
}
message ExecPluginResponse {
  int32 exit_code = 1;
  string output   = 2;
  string error    = 3;
}
message BenchmarkResponse { repeated GpuBenchmark results = 1; }

message GetNodeInfoRequest {}
message PingRequest {}
message PingResponse { string agent_version = 1; }

service NodeAgent {
  rpc GetNodeInfo(GetNodeInfoRequest) returns (NodeInfo);
  rpc DescribeProcess(DescribeProcessRequest) returns (ProcessDetail);
  rpc LaunchJob(LaunchJobRequest) returns (LaunchJobResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Benchmark(BenchmarkRequest) returns (BenchmarkResponse);
  // Open a short-lived TCP sink, then blast at somebody else's.
  rpc NetSink(NetSinkRequest) returns (NetSinkResponse);
  rpc NetProbe(NetProbeRequest) returns (NetProbeResponse);
  rpc ExecPlugin(ExecPluginRequest) returns (ExecPluginResponse);
}
