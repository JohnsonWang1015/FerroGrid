[workspace]
resolver = "2"
members = [
    "crates/ferro-proto",
    "crates/ferro-gpu",
    "crates/ferro-agent",
    "crates/ferro-controller",
    "crates/ferro-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
ferro-proto = { path = "crates/ferro-proto" }
ferro-gpu = { path = "crates/ferro-gpu" }

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic-health = "0.14"

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nvml-wrapper = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
comfy-table = "8"
hostname = "0.4"
regex = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
